<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="edge" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4.5" result="grow" />
      <feFlood flood-color="#fff8ec" />
      <feComposite in2="grow" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <radialGradient id="g-kiwi" cx=".5" cy=".5" r=".5">
      <stop offset=".25" stop-color="#d6ec8a" />
      <stop offset="1" stop-color="#6fae2c" />
    </radialGradient>
    <path d="M60 46V17" id="ray" stroke="#e9f5b8" stroke-linecap="round" stroke-width="1.6" />
    <ellipse cx="60" cy="40" fill="#1b1208" id="seed" rx="1.9" ry="3.6" />
  </defs>
  <g filter="url(#edge)">
  <circle cx="60" cy="60" fill="#6b4a2b" r="52" />
  <circle cx="60" cy="60" fill="url(#g-kiwi)" r="47" />
  <use href="#ray" /><use href="#ray" transform="rotate(30 60 60)" /><use href="#ray" transform="rotate(60 60 60)" />
  <use href="#ray" transform="rotate(90 60 60)" /><use href="#ray" transform="rotate(120 60 60)" /><use href="#ray" transform="rotate(150 60 60)" />
  <use href="#ray" transform="rotate(180 60 60)" /><use href="#ray" transform="rotate(210 60 60)" /><use href="#ray" transform="rotate(240 60 60)" />
  <use href="#ray" transform="rotate(270 60 60)" /><use href="#ray" transform="rotate(300 60 60)" /><use href="#ray" transform="rotate(330 60 60)" />
  <use href="#seed" transform="rotate(15 60 60)" /><use href="#seed" transform="rotate(45 60 60)" /><use href="#seed" transform="rotate(75 60 60)" />
  <use href="#seed" transform="rotate(105 60 60)" /><use href="#seed" transform="rotate(135 60 60)" /><use href="#seed" transform="rotate(165 60 60)" />
  <use href="#seed" transform="rotate(195 60 60)" /><use href="#seed" transform="rotate(225 60 60)" /><use href="#seed" transform="rotate(255 60 60)" />
  <use href="#seed" transform="rotate(285 60 60)" /><use href="#seed" transform="rotate(315 60 60)" /><use href="#seed" transform="rotate(345 60 60)" />
  <ellipse cx="60" cy="60" fill="#f7f4cf" rx="13" ry="10.5" />
