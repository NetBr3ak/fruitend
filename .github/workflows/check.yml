name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node check-palette.mjs
      - run: npm ci --prefix .github/checks --ignore-scripts
      - run: .github/checks/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: node .github/checks/controls.cjs
      - run: node .github/checks/motion-labels.cjs
      - run: node .github/checks/inspector.cjs
